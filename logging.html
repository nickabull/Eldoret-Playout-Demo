<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bull'sHits · As-Run Logging</title><style>*{box-sizing:border-box}body{margin:0;background:#081422;color:#e5f1fa;font:14px system-ui}header{display:flex;align-items:center;gap:20px;padding:15px 22px;background:#132b40;flex-wrap:wrap}h1{margin:0;font-size:22px}a{color:#8bd2ff}main{padding:18px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:15px}button,select{background:#1a344b;color:#fff;border:1px solid #4b6d88;border-radius:5px;padding:9px;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:11px;text-align:left;border-bottom:1px solid #2a455c}th{background:#1c354b}tr:nth-child(even){background:#102638}.fail{color:#ff9b8f;font-weight:800}.play{color:#91f1bb}.status{color:#a5c0d1}#count{font-weight:700}@media(max-width:700px){table{font-size:11px}th,td{padding:5px}}</style><link rel="stylesheet" href="global-nav.css?v=0.6.18"></head><body><script src="global-nav.js?v=0.6.18" defer></script><header><h1>BULL'SHITS · AS-RUN LOG</h1><a href="index.html" target="_blank">↗ Main Desk</a><a href="scheduling.html" target="_blank">↗ Scheduling</a><small>v0.6.1</small></header><main><div class="toolbar"><label>Event type <select id="filter"><option value="">ALL EVENTS</option><option>PLAY</option><option>STOP</option><option>ENDED</option><option>FAILED</option></select></label><button id="export">EXPORT CSV</button><button id="refresh">REFRESH</button><span id="count"></span><span class="status">Auto-refreshes when another tab records an event.</span></div><table><thead><tr><th>Date</th><th>Time (local)</th><th>Event</th><th>Fader</th><th>Title</th><th>Artist</th><th>Source</th><th>Details / failure</th></tr></thead><tbody id="rows"></tbody></table></main><script>
const KEY='bullshits-playout-events-v1',$=id=>document.getElementById(id);let exportRows=[];const cell=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
function draw(){let entries=[];try{entries=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}const filter=$('filter').value;entries=entries.filter(x=>!filter||x.kind===filter);$('count').textContent=entries.length+' EVENTS';$('rows').innerHTML='';exportRows=[];entries.slice().reverse().forEach(x=>{const d=new Date(x.at),row=[d.toLocaleDateString('en-GB'),d.toLocaleTimeString('en-GB',{hour12:false}),x.kind||'',x.fader||'',x.title||'',x.artist||'',x.source||'',x.reason||''];exportRows.push(row);const tr=document.createElement('tr');row.forEach((v,i)=>{const td=document.createElement('td');td.textContent=v;if(i===2)td.className=x.kind==='FAILED'?'fail':x.kind==='PLAY'?'play':'';tr.appendChild(td)});$('rows').appendChild(tr)})}
$('filter').onchange=draw;$('refresh').onclick=draw;window.addEventListener('storage',e=>{if(e.key===KEY)draw()});$('export').onclick=()=>{const lines=[['Date','Time','Event','Fader','Title','Artist','Source','Details'],...exportRows].map(r=>r.map(cell).join(','));const url=URL.createObjectURL(new Blob([lines.join('\r\n')],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='bullshits-as-run-log.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};draw();
</script></body></html>
