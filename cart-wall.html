<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bull'sHits · Cart Wall</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07111e;color:#e5f1fa;font:14px system-ui,Arial}header{display:flex;align-items:center;gap:15px;padding:12px 18px;background:#122538;border-bottom:2px solid #335574;flex-wrap:wrap}h1{margin:0;font-size:21px;letter-spacing:.1em}h1 span{color:#e9b76a}header a{color:#a9dfff;text-decoration:none}header small{color:#9db4c7}.spacer{flex:1}button{cursor:pointer}nav{display:flex;gap:7px;padding:12px 18px;flex-wrap:wrap}nav button{padding:10px 18px;background:#1b3046;color:#fff;border:1px solid #47647f;border-radius:5px;font-weight:700}nav button.active{background:#a1323c;border-color:#f07c85}#wall{padding:0 18px 18px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px}.pad{min-height:104px;border-radius:9px;border:2px solid #ffffff55;box-shadow:inset 0 2px #ffffff33,0 5px 8px #0008;display:flex;flex-direction:column;justify-content:space-between;text-align:left;padding:10px;min-width:0;color:white;font-weight:800}.pad b{font-size:14px;overflow-wrap:anywhere}.pad small{font-size:11px;opacity:.9}.pad.playing{outline:3px solid #eaff6a;box-shadow:0 0 20px #eaff6a66}.pad.empty{background:#1c3043!important;color:#9bb0c0;border-style:dashed}#message{padding:4px 18px;color:#d2dfeb;font-size:12px}input{background:#152d43;color:#fff;border:1px solid #4a6b88;padding:8px;border-radius:5px;max-width:180px}@media(max-width:1100px){#wall{grid-template-columns:repeat(6,minmax(0,1fr))}}@media(max-width:750px){#wall{grid-template-columns:repeat(4,minmax(0,1fr))}.pad{min-height:85px}}@media(max-width:440px){#wall{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style><link rel="stylesheet" href="global-nav.css?v=0.6.18"></head><body><script src="global-nav.js?v=0.6.18" defer></script><header><h1>BULL'SHITS <span>CART WALL</span></h1><small>PAGE 2 · BUILD v0.6.1</small><div class="spacer"></div><span id="engineStatus">LOCAL CART ENGINE</span></header><nav id="banks"></nav><div id="message">For now this page plays its own loaded audio. Cross-tab audio routing and playback-state synchronisation require the shared engine.</div><div id="wall"></div><script>
const audit=(kind,details={})=>{try{const key='bullshits-playout-events-v1',a=JSON.parse(localStorage.getItem(key)||'[]');a.push({id:crypto.randomUUID(),at:new Date().toISOString(),kind,fader:'D',source:'CART WALL',...details});localStorage.setItem(key,JSON.stringify(a.slice(-5000)))}catch(e){}};
const bankNames=['JINGLES','SFX','BEDS','PROMOS'],colors=['#a72d3a','#2468b4','#bd7523','#19855b','#7541ad','#257e86','#b64d87','#a3a124'];let bank=0;
const dbName='eldoret-cartwall-media';let db,players={},files={};
function openDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open(dbName,1);q.onupgradeneeded=()=>q.result.createObjectStore('audio');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function put(key,blob){const tx=db.transaction('audio','readwrite');tx.objectStore('audio').put(blob,key);return new Promise((ok,no)=>{tx.oncomplete=ok;tx.onerror=no})}
async function get(key){return new Promise(ok=>{const q=db.transaction('audio').objectStore('audio').get(key);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}
const cfg=()=>JSON.parse(localStorage.getItem('eldoret-cartwall-v1')||'{}');const save=x=>localStorage.setItem('eldoret-cartwall-v1',JSON.stringify(x));
function draw(){const n=document.getElementById('banks');n.innerHTML='';bankNames.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x;b.className=i===bank?'active':'';b.onclick=()=>{bank=i;draw()};n.appendChild(b)});const wall=document.getElementById('wall');wall.innerHTML='';const data=cfg();for(let i=0;i<32;i++){const key=bank+'-'+i,entry=data[key],btn=document.createElement('button');btn.className='pad'+(entry?'':' empty')+(players[key]&&!players[key].paused?' playing':'');btn.style.background=entry?.color||colors[i%colors.length];btn.innerHTML='<small>HOTKEY '+String(i+1).padStart(2,'0')+'</small><b></b><small class="status"></small>';btn.querySelector('b').textContent=entry?.name||'EMPTY · LOAD AUDIO';btn.querySelector('.status').textContent=players[key]&&!players[key].paused?'● PLAYING':entry?'▶ FIRE / RIGHT CLICK TO EDIT':'CLICK TO LOAD';btn.onclick=async()=>{if(!entry){choose(i);return}let a=players[key];if(a&&!a.paused){a.pause();a.currentTime=0;audit('STOP',{title:entry.name});draw();return}const blob=await get(key);if(!blob){document.getElementById('message').textContent='Audio missing. Right-click to reload this cart.';return}if(a){a.pause();URL.revokeObjectURL(a.src)}a=new Audio(URL.createObjectURL(blob));players[key]=a;a.onended=()=>{audit('ENDED',{title:entry.name});draw()};try{await a.play();audit('PLAY',{title:entry.name})}catch(e){audit('FAILED',{title:entry.name,reason:e.message});document.getElementById('message').textContent=e.message}draw()};btn.oncontextmenu=e=>{e.preventDefault();choose(i)};wall.appendChild(btn)}}
const picker=document.createElement('input');picker.type='file';picker.accept='audio/*';picker.hidden=true;document.body.appendChild(picker);let target=0;
function choose(i){target=i;picker.value='';picker.click()}
picker.onchange=async()=>{const file=picker.files[0];if(!file)return;const key=bank+'-'+target;await put(key,file);const data=cfg();data[key]={name:file.name.replace(/\.[^.]+$/,''),color:colors[target%colors.length]};save(data);draw();document.getElementById('message').textContent='Loaded '+file.name+' into '+bankNames[bank]+' '+(target+1)};
openDB().then(x=>{db=x;draw()}).catch(e=>document.getElementById('message').textContent='Browser storage unavailable: '+e.message);
window.addEventListener('storage',e=>{if(e.key==='eldoret-cartwall-v1')draw()});
</script></body></html>
