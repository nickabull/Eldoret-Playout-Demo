<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bull'sHits · Scheduling</title><style>
*{box-sizing:border-box}body{margin:0;background:#081422;color:#e3eff8;font:14px system-ui}header{display:flex;align-items:center;gap:20px;background:#132b40;padding:15px 22px}h1{margin:0;font-size:22px}a{color:#8cd4ff}main{padding:18px;max-width:1300px;margin:auto}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}button,input{padding:9px;background:#1a354c;color:white;border:1px solid #466c8c;border-radius:5px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.tile{background:#13293e;border:1px solid #365572;padding:14px;border-radius:7px}.tile b{display:block;font-size:23px;margin-top:7px}table{border-collapse:collapse;width:100%;background:#102336}th,td{padding:11px;border-bottom:1px solid #2a455c;text-align:left}th{background:#1b374e}tr:nth-child(even){background:#152b40}.warn{color:#f3bd78}.muted{color:#91aec1}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}table{font-size:11px}th,td{padding:6px}}
</style><link rel="stylesheet" href="global-nav.css?v=0.6.18"></head><body><script src="global-nav.js?v=0.6.39" defer></script><header><h1>BULL'SHITS · SCHEDULING</h1><small>v0.6.1</small></header><main><div class="toolbar"><label>Programme starts <input type="time" id="start" value="19:00"></label><button id="refresh">REFRESH RUNNING ORDER</button><button id="csv">EXPORT SCHEDULE CSV</button><span class="muted">Planning preview from the main desk's saved running order</span></div><div class="grid"><div class="tile">EVENTS<b id="count">0</b></div><div class="tile">DURATION<b id="duration">00:00</b></div><div class="tile">ESTIMATED FINISH<b id="finish">--:--</b></div><div class="tile">AUDIO WARNINGS<b id="warnings">0</b></div></div><table><thead><tr><th>#</th><th>Planned time</th><th>Title</th><th>Artist</th><th>Length</th><th>Mode</th><th>Notes</th></tr></thead><tbody id="rows"></tbody></table></main><script>
const $=id=>document.getElementById(id);let exportRows=[];
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
const csvCell=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
function draw(){let log=[];try{log=JSON.parse(localStorage.getItem('eldoret-demo')||'[]')}catch(e){};let [h,m]=$('start').value.split(':').map(Number),seconds=h*3600+m*60,total=0,warnings=0;const rows=$('rows');rows.innerHTML='';exportRows=[];log.forEach((x,i)=>{const dur=Math.max(0,Number(x.dur)||0),time=fmt(seconds%86400),notes=[];if(!x.url)notes.push('Check audio availability');if(x.fixed)notes.push('Hard time: '+x.fixed);if(!dur)notes.push('Duration missing');if(notes.length)warnings++;const vals=[i+1,time,x.title||'',x.artist||'',fmt(dur),x.type||'auto',notes.join(' · ')];const tr=document.createElement('tr');vals.forEach((v,j)=>{const td=document.createElement('td');td.textContent=v;if(j===6&&notes.length)td.className='warn';tr.appendChild(td)});rows.appendChild(tr);exportRows.push(vals);seconds+=dur;total+=dur});$('count').textContent=log.length;$('duration').textContent=fmt(total);$('finish').textContent=fmt(seconds%86400);$('warnings').textContent=warnings}
$('refresh').onclick=draw;$('start').onchange=draw;$('csv').onclick=()=>{const lines=[['#','Planned time','Title','Artist','Length','Mode','Notes'],...exportRows].map(r=>r.map(csvCell).join(','));const url=URL.createObjectURL(new Blob([lines.join('\r\n')],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='bullshits-schedule.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};window.addEventListener('storage',draw);draw();
</script></body></html>
